name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag (e.g. 1.0.2.5); empty uses Directory.Build.props'
        required: false
        type: string
      desktop_smoke:
        description: 'Require desktop smoke tests on a dedicated interactive Windows runner'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    name: Version
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Repository and localization checks
        run: |
          python tools/check-repository.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository check failed.' }
          python tools/check-ui-localization.py
          if ($LASTEXITCODE -ne 0) { throw 'Localization check failed.' }
          python tools/check-version.py
          if ($LASTEXITCODE -ne 0) { throw 'Documented version check failed.' }
      - name: Desktop build with warnings as errors
        run: dotnet build src/SurgeLink.App -c Release -p:Platform=x64 --nologo -warnaserror
      - name: Test release tooling
        run: |
          python -m unittest discover -s tools/tests -p test_release_notes.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Release notes regression tests failed.' }
          ./tools/tests/test-release-tag.ps1
      - name: Resolve version and target
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $tag = ([string]$env:REQUESTED_VERSION).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $tag = $env:GITHUB_REF_NAME }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            [xml]$props = Get-Content Directory.Build.props -Raw
            $tag = [string]($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') { throw 'Use a numeric version, optionally prefixed with v.' }
          $parsed = [version]$version
          if (@($parsed.Major, $parsed.Minor, $parsed.Build, [Math]::Max(0, $parsed.Revision) | Where-Object { $_ -gt 65535 }).Count) { throw 'Version components must be <= 65535.' }
          if ($parsed.Major -eq 0 -and $parsed.Minor -eq 0 -and $parsed.Build -eq 0 -and $parsed.Revision -le 0) { throw 'Version must be greater than zero.' }
          $version = if ($parsed.Revision -lt 0) { "${parsed}.0" } else { $parsed.ToString() }
          $sha = git rev-parse HEAD
          $existing = git rev-parse --verify "refs/tags/$tag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -ne $sha) { throw 'The tag points to another commit. Run this workflow on that tag, or choose a new version.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          exit 0

  installer:
    name: Installer
    needs: prepare
    uses: ./.github/workflows/package-exe.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  appx:
    name: APPX
    needs: prepare
    uses: ./.github/workflows/package-appx.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  desktop-smoke:
    name: Desktop smoke tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_smoke }}
    needs: prepare
    # Use a dedicated runner started in a signed-in, unlocked desktop session.
    runs-on: [self-hosted, Windows, X64, surgelink-desktop]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and exercise the Release desktop app
        run: |
          if (-not [Environment]::UserInteractive -or (Get-Process -Id $PID).SessionId -eq 0) {
            throw 'Desktop smoke tests require a signed-in Windows session.'
          }
          if (Get-Process SurgeLink -ErrorAction SilentlyContinue) {
            throw 'Close any existing SurgeLink instance on the dedicated runner.'
          }
          dotnet build src/SurgeLink.App -c Release -p:Platform=x64 --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed.' }
          ./tools/verify-app.ps1 -NoBuild -SkipTests -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Desktop smoke tests failed.' }
          ./tools/verify-sftp-menu.ps1 -NoBuild -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'File menu smoke tests failed.' }

  publish:
    name: Publish
    needs: [prepare, installer, appx, desktop-smoke]
    concurrency:
      group: publish-${{ needs.prepare.outputs.version }}
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.installer.result == 'success' && needs.appx.result == 'success' && (!inputs.desktop_smoke || needs.desktop-smoke.result == 'success') }}
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: SurgeLink*
          path: artifacts/release
          merge-multiple: true
          # All artifacts are uploaded with archive:false. Preserve distribution
          # ZIPs as files instead of extracting their APPX/certificate contents.
          skip-decompress: true
      - name: List downloaded assets
        run: Get-ChildItem -LiteralPath artifacts/release -Recurse -File | Select-Object FullName, Length
      - name: Validate assets and write release notes
        run: python tools/release-notes.py --version $env:RELEASE_VERSION --tag $env:RELEASE_TAG --sha $env:RELEASE_SHA --repository $env:GITHUB_REPOSITORY --assets artifacts/release --output artifacts/release-notes.md
      - name: Publish release
        run: |
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          $requested = [version]$env:RELEASE_VERSION
          foreach ($publishedTag in $existing) {
            $published = $null
            if ([version]::TryParse(($publishedTag -replace '^v', ''), [ref]$published) -and $published.Build -ge 0) {
              if ($published.Revision -lt 0) { $published = [version]"${published}.0" }
              if ($published -eq $requested) { throw 'This release version already exists; refusing to replace it.' }
            }
          }
          $assets = @(Get-ChildItem -LiteralPath artifacts/release -File |
            Where-Object { $_.Extension -ne '.sha256' } | ForEach-Object FullName)
          # Upload every asset to a draft before making the release public.
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_SHA --title "SurgeLink $env:RELEASE_VERSION" --notes-file artifacts/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. Inspect the draft before retrying.' }
          # Draft creation does not guarantee that the Git tag exists. Create or
          # verify the exact remote tag before making the uploaded release public.
          ./tools/ensure-release-tag.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -Sha $env:RELEASE_SHA
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; assets remain in the draft.' }
          ./tools/ensure-release-tag.ps1 -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -Sha $env:RELEASE_SHA
          Get-Content artifacts/release-notes.md >> $env:GITHUB_STEP_SUMMARY
